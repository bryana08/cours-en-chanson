version: "3.8"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: cours_chanson
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: cours_chanson
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"  # interface d'administration

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: changeme
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  # À ajouter au fur et à mesure : api-gateway, ocr, extraction-paroles, audio, utilisateur

volumes:
  postgres_data:
  minio_data:
